<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAgent 隐私政策</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      line-height: 1.8;
      color: #333;
      background: #fff;
    }
    h1 { font-size: 28px; border-bottom: 2px solid #eee; padding-bottom: 12px; }
    h2 { font-size: 22px; margin-top: 32px; color: #1a1a1a; }
    h3 { font-size: 18px; margin-top: 24px; }
    h4 { font-size: 16px; margin-top: 20px; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 10px 12px; text-align: left; }
    th { background: #f5f5f7; font-weight: 600; }
    tr:nth-child(even) { background: #fafafa; }
    code { background: #f5f5f7; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    pre { background: #f5f5f7; padding: 16px; border-radius: 8px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 4px solid #007aff; margin: 16px 0; padding: 8px 16px; background: #f0f7ff; }
    a { color: #007aff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    hr { border: none; border-top: 1px solid #eee; margin: 32px 0; }
    .loading { text-align: center; color: #999; padding: 60px 0; }
  </style>
</head>
<body>
  <div id="content" class="loading">加载中...</div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('privacy_policy.md')
      .then(r => r.text())
      .then(md => {
        document.getElementById('content').classList.remove('loading');
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(() => {
        document.getElementById('content').innerHTML =
          '<h1>XAgent 隐私政策</h1><p>加载失败，请访问 <a href="privacy_policy.md">Markdown 版本</a>。</p>';
      });
  </script>
</body>
</html>
